<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odisha Coastal Inundation & Evacuation Simulator</title>
<style>
:root{color-scheme:dark;--bg:#0b1320;--panel:#1b2230;--panel2:#252d3d;--line:rgba(255,255,255,.1);--text:#f1f5f9;--mute:#94a3b8;--red:#ff5a4f;--amber:#fbbc04;--green:#34a853;--blue:#3b6cf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#05080f;color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
.card{width:100%;max-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
.map{position:relative;aspect-ratio:653/359.15;background:var(--bg);container-type:inline-size}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.hdr{position:absolute;left:3%;top:4%;background:rgba(0,0,0,.65);border:1px solid var(--line);border-radius:6px;padding:6px 10px;z-index:3}
.hdr b{display:block;color:var(--amber);font-size:clamp(8px,1.9cqw,11px);letter-spacing:.04em}
.hdr span{font-size:clamp(9px,2cqw,12px)}
.pause{position:absolute;right:3%;top:4%;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--text);cursor:pointer;z-index:3;font-size:13px}
.pause:hover{background:rgba(255,255,255,.2)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7aa2ff;outline-offset:2px}
.lbl{position:absolute;transform:translate(-50%,0);white-space:nowrap;text-align:center;border-radius:6px;padding:2px 6px;font-size:clamp(7px,1.75cqw,11px);line-height:1.25;z-index:2;pointer-events:none}
.vil{background:rgba(5,8,15,.88);border:1px solid var(--line);margin-top:8px}
.vil b{display:block;font-weight:600}
.vil i{font-style:normal;font-weight:600}
.vil.dry i{color:#2ecc71}.vil.mid i{color:#fbbf24}.vil.hi i{color:var(--red)}
.mcs{background:rgba(23,37,84,.92);border:1px solid rgba(96,165,250,.4);transform:translate(-50%,-135%);color:#dbeafe;font-weight:600}
.mcs svg{width:9px;height:9px;vertical-align:-1px;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 20px;background:#141a26;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.stats small{display:block;color:var(--mute);font-size:10px;letter-spacing:.03em;text-transform:uppercase}
.stats strong{display:block;font-size:clamp(18px,5vw,26px);margin-top:2px;font-variant-numeric:tabular-nums;transition:color .3s}
.ctl{padding:18px 20px 22px}
.ctl>small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;margin-bottom:18px}
select:hover{border-color:#60a5fa}
.sl{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sl label{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:8px;gap:6px}
.sl output{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,var(--blue) var(--p,0%),#3a4357 var(--p,0%));margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--blue);border:0;cursor:pointer;box-shadow:0 0 8px rgba(59,108,240,.6)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--blue);border:0;cursor:pointer}
@media(max-width:560px){.sl{grid-template-columns:1fr;gap:14px}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:1}50%{transform:scale(1.3);opacity:.4}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s infinite}
.paused .pulse{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<main class="card" id="app">
  <div class="map" id="map">
    <div class="hdr"><b id="t1"></b><span id="t2"></span></div>
    <button class="pause" id="pause" aria-label="Pause animation">❚❚</button>
    <svg viewBox="0 0 653 359.15" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <radialGradient id="surgeG" cx="70%" cy="80%" r="75%">
          <stop offset="0" stop-color="#1d4ed8" stop-opacity=".5"/>
          <stop offset=".5" stop-color="#2563eb" stop-opacity=".3"/>
          <stop offset="1" stop-color="#0b1320" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="warn" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fbbc04" stop-opacity=".4"/>
          <stop offset="1" stop-color="#fbbc04" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="danger" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ea4335" stop-opacity=".55"/>
          <stop offset="1" stop-color="#ea4335" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="653" height="359.15" fill="#0b1320"/>
      <g id="grid" stroke="#fff" stroke-width=".5" opacity=".07"></g>
      <rect id="surgeRect" width="653" height="359.15" fill="url(#surgeG)" opacity="0"/>
      <path id="wall" d="M 0,161.6175 Q 261.2,197.5325 457.09,143.66 T 653,215.49" fill="none" stroke-width="3.5" stroke-linecap="round"/>
      <text x="14" y="130" fill="#7c8aa3" font-size="9">Coastal Embankment Wall</text>
      <g id="pulses"></g><g id="routes"></g><g id="nodes"></g>
    </svg>
    <div id="labels"></div>
  </div>
  <div class="stats">
    <div><small>High-risk villages</small><strong id="risk" style="color:var(--red)"></strong></div>
    <div><small>Est. displaced pop.</small><strong id="pop"></strong></div>
    <div><small>Embankment status</small><strong id="emb"></strong></div>
  </div>
  <div class="ctl">
    <small>Odisha high-risk target area</small>
    <select id="region" aria-label="Target area"></select>
    <div class="sl">
      <div><label for="surge">Storm surge height <output id="oS"></output></label><input id="surge" type="range" min="0" max="6" step="0.1" value="0"></div>
      <div><label for="rain">Rainfall intensity <output id="oR"></output></label><input id="rain" type="range" min="0" max="200" step="1" value="0"></div>
      <div><label for="dyke">Embankment strength <output id="oE"></output></label><input id="dyke" type="range" min="0" max="100" step="1" value="100"></div>
    </div>
  </div>
</main>
<script>
// Village: [name, x, y, population, elevation m, surge exposure k] ; shelter: [name, x, y]
const REGIONS = {
  ken:{name:"Kendrapara Wetland & Coast",t1:"MAHANADI DELTA MODEL",t2:"Mouth of Bay of Bengal",focus:[70,80],
    shelters:[["Rajnagar MCS",228.5,81],["Mahakalapada MCS",457.1,127.7]],
    villages:[["Bhitarkanika Edge",97.9,197.5,1250,.6,.66],["Pattamundai Basin",195.9,150.8,900,2,.5],["Garahpur Village",404.8,233.4,1800,1.3,.78],["Satabhaya Coastal",313.4,305.2,2100,.3,1.02],["Jamboo Settlement",535.4,280.1,1300,.7,.935]]},
  jag:{name:"Jagatsinghpur Mahanadi Delta",t1:"MAHANADI DELTA CORRIDOR",t2:"Paradip to Erasama",focus:[50,90],
    shelters:[["Paradip Port MCS",350,90],["Erasama Core MCS",210,160]],
    villages:[["Siali Coastline",120,240,1650,.6,.9],["Padmapur Lowlands",280,270,2400,.3,1.05],["Kujang Buffer Slopes",420,180,1100,1.6,.55],["Balikuda Sector",490,290,3200,.8,.95],["Naugaon Delta Ring",580,220,1450,1.2,.8]]},
  pur:{name:"Puri Coastal Sector",t1:"PURI COASTAL SECTOR",t2:"Chilika to Konark",focus:[30,85],
    shelters:[["Puri Head MCS",180,120],["Astaranga MCS",400,100],["Konark Buffer MCS",480,190]],
    villages:[["Chilika Wetland Fringe",80,210,1950,.7,.75],["Satyabadi Depressions",260,230,2800,.5,.95],["Konark Marine Fringe",340,290,1500,1,1.05],["Gop Estuary Block",550,260,2100,1.4,.85],["Kanas Low-lying Grid",610,140,1200,1.8,.5]]}
};
let off = 0;
const $ = id => document.getElementById(id);
const W = 653, H = 359.15, fmt = n => Math.round(n).toLocaleString("en-IN");
const sel = $("region");
for (const k in REGIONS) sel.add(new Option(REGIONS[k].name, k));

let grid = "";
for (let i = 1; i < 7; i++) grid += `<line x1="0" x2="${W}" y1="${i*H/7}" y2="${i*H/7}"/>`;
for (let i = 1; i < 11; i++) grid += `<line y1="0" y2="${H}" x1="${i*W/11}" x2="${i*W/11}"/>`;
$("grid").innerHTML = grid;

function render() {
  const r = REGIONS[sel.value];
  const surge = +$("surge").value, rain = +$("rain").value, dyke = +$("dyke").value;
  $("oS").textContent = surge.toFixed(1) + " m";
  $("oR").textContent = rain + " mm/hr";
  $("oE").textContent = dyke + "%";
  $("t1").textContent = r.t1; $("t2").textContent = r.t2;

  const sr = $("surgeRect");
  sr.setAttribute("opacity", Math.min(0.95, surge * 0.12 + rain * 0.004));
  $("surgeG").setAttribute("cx", r.focus[0] + "%"); $("surgeG").setAttribute("cy", r.focus[1] + "%");

  // Weaker embankment lets more surge through (+0.6% per point below 100%)
  const gate = 1 + (100 - dyke) * 0.006;
  const shield = '<svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z" fill="#34d399"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#052e1b" stroke-width="2.4"/></svg>';
  let pulses = "", routes = "", nodes = "", labels = "", risk = 0, pop = 0;
  r.shelters.forEach(s => {
    nodes += `<polygon points="${s[1]},${s[2]-9} ${s[1]-8},${s[2]+6} ${s[1]+8},${s[2]+6}" fill="#3b6cf0" stroke="#dbeafe" stroke-width="1.5"/>`;
    labels += `<div class="lbl mcs" style="left:${s[1]/W*100}%;top:${s[2]/H*100}%">${shield}${s[0]}</div>`;
  });
  r.villages.forEach(v => {
    const [name, x, y, p, elev, k] = v;
    // Surge above the village's ground level, plus rain pooling everywhere
    const depth = Math.max(0, surge * k * gate - elev) + rain * 0.018;
    const wet = depth > 0.005, hi = depth >= 1.5, mid = wet && !hi;
    const col = hi ? "#ea4335" : (depth >= 0.5 ? "#fbbc04" : "#34a853");
    if (hi) risk++;
    if (wet) pop += p / (1 + Math.exp(-(depth - 1.15) / 0.3));
    let best = null, bd = 1e9;
    r.shelters.forEach(s => { const d = Math.hypot(x - s[1], y - s[2]); if (d < bd) { bd = d; best = s; } });
    const cut = depth > 2;  // route is flooded
    if (hi || (mid && depth >= 0.5)) pulses += `<circle class="pulse" cx="${x}" cy="${y}" r="30" fill="url(#${hi ? "danger" : "warn"})"/>`;
    routes += cut
      ? `<line x1="${x}" y1="${y}" x2="${best[1]}" y2="${best[2]}" stroke="#ea4335" stroke-width="2" stroke-dasharray="6 4" opacity=".85"/>`
      : `<line class="route" stroke-dashoffset="${off}" x1="${x}" y1="${y}" x2="${best[1]}" y2="${best[2]}" stroke="#34a853" stroke-width="2.5" stroke-dasharray="6 4"/>` +
        `<circle cx="${(x+best[1])/2}" cy="${(y+best[2])/2}" r="3.5" fill="#34a853"/>`;
    nodes += `<circle cx="${x}" cy="${y}" r="6" fill="${col}" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>`;
    const txt = wet ? "+" + depth.toFixed(2) + "m Flood" : "Dry (Elev: " + elev + "m)";
    labels += `<div class="lbl vil ${wet ? (hi ? "hi" : "mid") : "dry"}" style="left:${x/W*100}%;top:${y/H*100}%"><b>${name}</b><i>${txt}</i></div>`;
  });
  $("pulses").innerHTML = pulses; $("routes").innerHTML = routes; $("nodes").innerHTML = nodes; $("labels").innerHTML = labels;

$("risk").textContent = risk + " / " + r.villages.length;
  $("pop").textContent = fmt(pop);
  const e = $("emb"), wall = $("wall");
  let st = dyke >= 60 ? ["Stable", "#34a853", ""] : dyke >= 30 ? ["Leaking", "#fbbc04", ""] : ["Breached", "#ea4335", "9 7"];
  e.textContent = st[0]; e.style.color = st[1];
  wall.setAttribute("stroke", st[1]);
  wall.setAttribute("stroke-dasharray", st[2]);
  wall.setAttribute("opacity", st[0] === "Stable" ? ".9" : ".85");
  [["surge", 6], ["rain", 200], ["dyke", 100]].forEach(([id, max]) => $(id).style.setProperty("--p", (+$(id).value / max * 100) + "%"));
}

["surge", "rain", "dyke"].forEach(id => $(id).addEventListener("input", render));
sel.addEventListener("change", render);
$("pause").addEventListener("click", function () {
  const p = $("app").classList.toggle("paused");
  this.textContent = p ? "▶" : "❚❚";
  this.setAttribute("aria-label", p ? "Resume animation" : "Pause animation");
});
render();
// Flowing dashes on the green evacuation routes (drawn by script so it works regardless of CSS animation settings)
var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
last = 0;
function tick(t) {
  const dt = t - last; last = t;
  if (!$("app").classList.contains("paused") && !still) {
    off = (off - dt * 0.02) % 10;
    document.querySelectorAll(".route").forEach(l => l.setAttribute("stroke-dashoffset", off));
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
